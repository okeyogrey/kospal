<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>KOSPAL</title>
        <style>
            :root {
                color-scheme: dark;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: grid;
                place-items: center;
                background: #0c0f14;
                color: #e8ecf1;
                font-family: "Segoe UI", system-ui, sans-serif;
            }
            .panel {
                text-align: center;
                max-width: 22rem;
                padding: 1.5rem;
            }
            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.5rem;
                font-weight: 650;
                letter-spacing: 0.04em;
            }
            p {
                margin: 0;
                color: #9aa7b5;
                line-height: 1.45;
            }
            .pulse {
                width: 2.5rem;
                height: 2.5rem;
                margin: 0 auto 1.25rem;
                border: 2px solid #2a3542;
                border-top-color: #7eb6ff;
                border-radius: 999px;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="panel">
            <div class="pulse" aria-hidden="true"></div>
            <h1>KOSPAL</h1>
            <p>Starting the local retail server…</p>
        </div>
    </body>
</html>
